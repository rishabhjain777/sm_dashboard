<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NSE F&amp;O Market Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css?v=1791178908">
</head>
<body>

  <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px;">
    <h2 style="margin: 0;">NSE F&amp;O Market Dashboard</h2>
    <div style="font-size: 13px; color: #475569; font-weight: 500;">
      Last Refreshed: <strong style="color: #0f172a;">05 Oct 2026, 11:11:48 AM IST</strong>
      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #16a34a; margin-left: 6px;" title="Daemon Active"></span>
    </div>
  </div>

  <div class="tab-nav">
    <button class="tab-nav-btn active" id="tabBtn-market" onclick="switchDashboardTab('market')">
      &#128202; F&amp;O Market Signals
    </button>
    <button class="tab-nav-btn" id="tabBtn-analyzer" onclick="switchDashboardTab('analyzer')">
      &#128373; 360&#176; Stock Analyzer
      <span class="tab-badge" style="background:#2563eb; color:white;">Unified</span>
    </button>
    <button class="tab-nav-btn" id="tabBtn-trade-plan" onclick="switchDashboardTab('trade-plan')">
      &#127919; Prediction Result
      <span class="tab-badge" id="pred-badge">0 Active</span>
    </button>
    <button class="tab-nav-btn" id="tabBtn-quality" onclick="switchDashboardTab('quality')">
      &#9733; Stock Scores (Q / G / V / T)
      <span class="tab-badge">213</span>
    </button>
    <button class="tab-nav-btn" id="tabBtn-analytics" onclick="switchDashboardTab('analytics')">
      &#9889; AI Quant Predictions
      <span class="tab-badge">213</span>
    </button>
    <button class="tab-nav-btn" id="tabBtn-retrospective" onclick="switchDashboardTab('retrospective')">
      &#128221; Daily Retrospective
      <span class="tab-badge">4</span>
    </button>
    <button class="tab-nav-btn" id="tabBtn-todos" onclick="switchDashboardTab('todos')">
      &#9889; AI Improvement To-Dos
      <span class="tab-badge" id="nav-todos-badge">10</span>
    </button>
  </div>

  <div id="tab-container">
    <div id="tabLoading" class="tab-loading-spinner" style="display:none;">
      <div class="tab-spinner"></div>
      <div class="tab-loading-text">Loading dashboard intelligence...</div>
    </div>
  </div>

  <script src="js/tab-templates.js?v=1791178908"></script>
  <script src="js/dashboard.js?v=1791178908"></script>
</body>
</html>
