<div class="analyzer-hero-card">
  <div style="font-size:18px; font-weight:800; color:#0f172a; margin-bottom:4px;">
    &#128373; 360&#176; Stock Intelligence Dossier
  </div>
  <div style="font-size:13px; color:#475569; margin-bottom:14px;">
    Search any NSE listed equity stock or F&amp;O derivative to view synthesized confluence: Market Signal, Quality/Score breakdown, AI Quant model stance, and Final Actionable Verdict.
  </div>

  <div style="position:relative; max-width:600px;">
    <div style="display:flex; gap:8px;">
      <input
        type="text"
        id="analyzerInput"
        placeholder="Search any share symbol or name (e.g. RELIANCE, TCS, MANORAMA)..."
        oninput="onAnalyzerSearchInput(this.value)"
        onkeydown="onAnalyzerSearchKeyDown(event)"
        style="flex:1; padding:10px 14px; font-size:14px; border:2px solid #cbd5e1; border-radius:8px; outline:none;"
      >
      <button onclick="triggerAnalyzerSearch()" class="analyzer-search-btn">
        Analyze
      </button>
    </div>
    <div id="analyzerSuggestions" class="analyzer-suggestions" style="display: none;"></div>
  </div>

  <div style="margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
    <span style="font-size:12px; font-weight:700; color:#64748b;">Quick Stocks:</span>
    <button class="analyzer-chip" onclick="selectAnalyzerStock('RELIANCE')">RELIANCE</button>
    <button class="analyzer-chip" onclick="selectAnalyzerStock('TCS')">TCS</button>
    <button class="analyzer-chip" onclick="selectAnalyzerStock('HDFCBANK')">HDFCBANK</button>
    <button class="analyzer-chip" onclick="selectAnalyzerStock('INFY')">INFY</button>
    <button class="analyzer-chip" onclick="selectAnalyzerStock('MANORAMA')">MANORAMA</button>
    <button class="analyzer-chip" onclick="selectAnalyzerStock('SBIN')">SBIN</button>
    <button class="analyzer-chip" onclick="selectAnalyzerStock('ICICIBANK')">ICICIBANK</button>
    <button class="analyzer-chip" onclick="selectAnalyzerStock('ZOMATO')">ZOMATO</button>
  </div>
</div>

<div id="analyzerDossier">
